
name: Build MAX ULTRA EDITOR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -o "MAX_ULTRA_EDITOR_PROJECT (2).zip" -d project
          find project -name settings.gradle.kts -o -name settings.gradle

      - name: Build APK
        run: |
          ROOT=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)
          test -n "$ROOT"
          cd "$(dirname "$ROOT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-ULTRA-EDITOR-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
